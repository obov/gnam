name: ci
on:
  push: { branches: [main] }
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - uses: oven-sh/setup-bun@v2
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - if: github.event_name == 'push'
        run: node bin/gnam.js verify --push "${{ github.event.before }}" "${{ github.sha }}"
      - if: github.event_name == 'pull_request'
        run: node bin/gnam.js verify --range "origin/${{ github.base_ref }}..HEAD"
